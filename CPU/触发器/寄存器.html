<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4位寄存器 · 工程符号版</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#0d1117;color:#c9d1d9;
  font-family:"Microsoft YaHei","PingFang SC",sans-serif;
  display:flex;flex-direction:column;align-items:center;
  min-height:100vh;padding:10px 14px;
}
h1{color:#58a6ff;font-size:16px;margin:6px 0 2px;letter-spacing:2px}
.sub{color:#484f58;font-size:11px;margin-bottom:8px}
.main{display:flex;gap:12px;align-items:flex-start;width:100%;max-width:1100px}
.svg-wrap{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.svg-box{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:6px}
.svg-box svg{display:block;width:100%;height:auto}
.displays{display:flex;gap:12px}
.displays .box{flex:1}
.panel{width:280px;flex-shrink:0;display:flex;flex-direction:column;gap:8px}
.box{background:#161b22;border:1px solid #30363d;border-radius:6px;padding:8px 10px}
.box h3{color:#484f58;font-size:11px;margin-bottom:6px;letter-spacing:1px}
.row{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}
.row label{font-size:12px;color:#8b949e;min-width:24px}
.sw{position:relative;width:34px;height:17px;background:#21262d;border-radius:9px;cursor:pointer;transition:background .25s}
.sw.on{background:#58a6ff}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:13px;height:13px;background:#fff;border-radius:50%;transition:transform .25s}
.sw.on::after{transform:translateX(17px)}
input[type=number]{background:#0d1117;color:#58a6ff;border:1px solid #58a6ff44;padding:4px 8px;border-radius:5px;font-size:14px;width:56px;text-align:center}
.btn{background:#0d1117;color:#58a6ff;border:1px solid #58a6ff44;padding:6px 10px;border-radius:5px;cursor:pointer;font-size:12px;width:100%;margin-bottom:5px;transition:all .15s}
.btn:hover{background:#58a6ff18}
.btn.p{animation:pp .12s}
@keyframes pp{0%{transform:scale(1)}50%{transform:scale(1.05)}100%{transform:scale(1)}}
.bv{font-size:18px;color:#58a6ff;letter-spacing:3px;font-family:Consolas,monospace;text-align:center}
.dv{font-size:12px;color:#d29922;margin-top:2px;text-align:center}
.notes{font-size:11px;line-height:1.6;color:#8b949e}
.notes b{color:#58a6ff}
.notes li{margin-left:14px;margin-bottom:2px}
@keyframes fd{to{stroke-dashoffset:-18}}
@media(max-width:800px){.main{flex-direction:column}.panel{width:100%}}
</style>
</head>
<body>
<h1>4 位寄存器</h1>
<p class="sub">D 触发器（上升沿触发）· 工程逻辑符号</p>

<div class="main">
  <!-- 左侧：SVG + 数值显示 -->
  <div class="svg-wrap">
    <div class="svg-box" id="svgC"></div>
    <div class="displays">
      <div class="box"><h3>输入 D</h3><div class="bv" id="db">0000</div><div class="dv" id="dd">= 0</div></div>
      <div class="box"><h3>输出 Q</h3><div class="bv" id="qb">0000</div><div class="dv" id="qd">= 0</div></div>
    </div>
  </div>
  <!-- 右侧：控制面板 -->
  <div class="panel">
    <div class="box"><h3>拨码开关 D[3:0]</h3>
      <div class="row"><label>D3</label><div class="sw" id="s3" onclick="tog(3)"></div></div>
      <div class="row"><label>D2</label><div class="sw" id="s2" onclick="tog(2)"></div></div>
      <div class="row"><label>D1</label><div class="sw" id="s1" onclick="tog(1)"></div></div>
      <div class="row"><label>D0</label><div class="sw" id="s0" onclick="tog(0)"></div></div>
      <div class="row" style="margin-top:4px"><label>十进制</label><input type=number id="di" min=0 max=15 value=0 oninput="setD()"></div>
    </div>
    <div class="box"><h3>时钟</h3>
      <button class="btn" id="cb" onclick="clk()">⏫ CLK 上升沿写入</button>
      <button class="btn" id="ab" onclick="auto()">自动时钟</button>
    </div>
    <div class="box notes"><b>符号说明</b>
      <ul>
        <li>矩形框内 <b>1D</b> = 数据输入，<b>&gt;C1</b> = 上升沿触发时钟</li>
        <li>4 个 DFF 并联，CLK 共用，构成 4 位寄存器</li>
        <li>64/128 位寄存器只是扩展触发器数量，原理一致</li>
      </ul>
    </div>
  </div>
</div>

<script>
let d=[0,0,0,0],q=[0,0,0,0],tmr=null;
const W=760,H=210;
const FX=190,FY=28,FW=78,FH=42,GY=46;

function svg(){
  let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  s+=`<text x="${W/2}" y="13" text-anchor="middle" fill="#58a6ff" font-size="10">CLK</text>`;
  s+=`<line x1="115" y1="10" x2="${W-18}" y2="10" stroke="#58a6ff" stroke-width="1.5"/>`;
  s+=`<text x="8" y="${FY+1.5*GY+FH/2+3}" fill="#484f58" font-size="8">D[3:0]</text>`;
  s+=`<text x="${W-32}" y="${FY+1.5*GY+FH/2+3}" fill="#484f58" font-size="8">Q[3:0]</text>`;

  for(let i=0;i<4;i++){
    const y=FY+i*GY,b=3-i;
    s+=`<rect x="${FX}" y="${y}" width="${FW}" height="${FH}" rx="2" fill="#0d1117" stroke="#58a6ff88" stroke-width="1.2"/>`;
    s+=`<text x="${FX+14}" y="${y+FH/2+3}" fill="#58a6ff" font-size="10" font-family="Consolas,monospace">1D</text>`;
    s+=`<text x="${FX+10}" y="${y-4}" fill="#58a6ff" font-size="8" font-family="Consolas,monospace">&gt;C1</text>`;
    s+=`<text x="${FX+FW-12}" y="${y+FH/2+3}" fill="#d29922" font-size="10" font-family="Consolas,monospace">Q</text>`;
    s+=`<text x="${FX+FW/2}" y="${y+FH+12}" text-anchor="middle" fill="#484f58" font-size="8">bit[${b}]</text>`;
    s+=`<line x1="${FX+14}" y1="${y}" x2="${FX+14}" y2="10" stroke="#58a6ff44" stroke-width="1"/>`;
    s+=`<line x1="52" y1="${y+FH/2}" x2="${FX}" y2="${y+FH/2}" stroke="#58a6ff" stroke-width="1.2" class="dl${b}"/>`;
    s+=`<circle cx="44" cy="${y+FH/2}" r="3.5" fill="#21262d" stroke="#484f58" stroke-width="1" class="sd${b}"/>`;
    const ox=FX+FW+48;
    s+=`<line x1="${FX+FW}" y1="${y+FH/2}" x2="${ox}" y2="${y+FH/2}" stroke="#d29922" stroke-width="1.2" class="ql${b}"/>`;
    s+=`<circle cx="${ox}" cy="${y+FH/2}" r="3.5" fill="#21262d" stroke="#484f58" stroke-width="1" class="qd${b}"/>`;
  }
  const ky=FY+3*GY+FH/2+2;
  s+=`<text x="10" y="${ky+3}" fill="#484f58" font-size="8">CLK</text>`;
  s+=`<rect id="kr" x="36" y="${ky-2}" width="24" height="13" rx="3" fill="#21262d" stroke="#484f58"/>`;
  s+=`<text id="kt" x="48" y="${ky+7}" text-anchor="middle" fill="#8b949e" font-size="7">L</text>`;
  s+=`</svg>`;
  document.getElementById('svgC').innerHTML=s;
}

function upd(){
  for(let i=0;i<4;i++){
    const b=3-i;
    const sw=document.getElementById('s'+b);
    const sd=document.querySelector('.sd'+b);
    const dl=document.querySelector('.dl'+b);
    if(d[b]){sw.classList.add('on');sd.setAttribute('fill','#58a6ff');dl.setAttribute('stroke','#58a6ff');dl.style.strokeDasharray='4 3';dl.style.animation='fd .5s linear infinite'}
    else{sw.classList.remove('on');sd.setAttribute('fill','#21262d');dl.setAttribute('stroke','#58a6ff44');dl.style.strokeDasharray='';dl.style.animation=''}
    const ql=document.querySelector('.ql'+b);
    const qd=document.querySelector('.qd'+b);
    if(q[b]){ql.setAttribute('stroke','#d29922');ql.style.strokeDasharray='4 3';ql.style.animation='fd .5s linear infinite';qd.setAttribute('fill','#d29922')}
    else{ql.setAttribute('stroke','#d2992244');ql.style.strokeDasharray='';ql.style.animation='';qd.setAttribute('fill','#21262d')}
  }
  const dv=d[3]*8+d[2]*4+d[1]*2+d[0];
  const qv=q[3]*8+q[2]*4+q[1]*2+q[0];
  document.getElementById('db').textContent=d.join('');
  document.getElementById('dd').textContent='= '+dv;
  document.getElementById('qb').textContent=q.join('');
  document.getElementById('qd').textContent='= '+qv;
  document.getElementById('di').value=dv;
}

function tog(b){d[b]^=1;upd()}
function setD(){let v=parseInt(document.getElementById('di').value)||0;v=Math.max(0,Math.min(15,v));d[3]=(v>>3)&1;d[2]=(v>>2)&1;d[1]=(v>>1)&1;d[0]=v&1;upd()}
function clk(){
  const b=document.getElementById('cb');b.classList.remove('p');void b.offsetWidth;b.classList.add('p');
  q=[...d];
  const r=document.getElementById('kr'),t=document.getElementById('kt');
  if(r){r.setAttribute('fill','#58a6ff');r.setAttribute('stroke','#58a6ff')}
  if(t){t.textContent='H';t.setAttribute('fill','#0d1117')}
  setTimeout(()=>{if(r){r.setAttribute('fill','#21262d');r.setAttribute('stroke','#484f58')}if(t){t.textContent='L';t.setAttribute('fill','#8b949e')}},180);
  upd();
}
function auto(){
  const b=document.getElementById('ab');
  if(tmr){clearInterval(tmr);tmr=null;b.textContent='自动时钟'}
  else{b.textContent='停止';tmr=setInterval(()=>{for(let i=0;i<4;i++)d[i]=Math.random()>.5?1:0;upd();setTimeout(clk,280)},1100)}
}

svg();upd();
</script>
</body>
</html>
