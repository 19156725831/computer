<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>主锁存器（门控D锁存器）4与非门 IEC国标符号</title>
<style>
*{box-sizing:border-box}
html,body{margin:12px;padding:0;background:#eef2f6;color:#1f2933;font-family:"Microsoft YaHei",Consolas,monospace;}
h1{margin:4px 0;font-size:18px;color:#2f5d8c;text-align:center}
.sub{text-align:center;font-size:13px;color:#556;margin-bottom:10px;}
.wrap{max-width:1100px;margin:0 auto;}
.top-row{display:flex;align-items:flex-start;gap:14px;justify-content:center;flex-wrap:wrap;}
.card-svg{background:#fff;border-radius:10px;padding:12px;box-shadow:0 2px 8px #00000012;}
.right-col{width:270px;display:flex;flex-direction:column;gap:10px;}
.ctrl-box{background:#fff;border-radius:10px;padding:12px;box-shadow:0 2px 8px #00000012;}
.state-box{background:#fff;border-radius:10px;padding:12px;box-shadow:0 2px 8px #00000012;}
svg{display:block}
button{font-size:12px;padding:6px 10px;border-radius:5px;border:1px solid #b6c2cf;background:#fff;cursor:pointer;margin:2px 1px;}
button:hover{background:#edf2f8;}
button.stepbtn{background:#1677ff;color:#fff;border-color:#1677ff;}
#msg{margin:8px auto;padding:8px 14px;background:#fff8e6;border-left:4px solid #ff9500;border-radius:0 6px 6px 0;min-height:36px;max-width:920px;}
.note{margin:6px 0;padding:6px 10px;background:#f8fafc;border-left:4px solid #0b7285;border-radius:0 6px 6px 0;font-size:11px;}
.stateRow{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
.stateBox{width:100px;text-align:center;padding:5px;border:1px solid #dde3ea;border-radius:5px;background:#fdfdfd;}
.stateVal{font-size:20px;font-weight:bold;margin:2px 0;}
.lab{font-size:11px;color:#667;}
h3{margin:0 0 8px;font-size:13px;color:#2f5d8c;}
</style>
</head>
<body>
<div class="wrap">
<h1>主锁存器（门控D锁存器）IEC国标符号仿真</h1>
<p class="sub">G1‑G2交叉耦合构成基本SR锁存器；方框内 & 代表与运算；输出小圆代表取反；橙色=高电平1</p>
<div class="top-row">
  <div class="card-svg">
    <h3 style="text-align:center">电路原理图（国标方形与非门）</h3>
    <svg viewBox="0 0 840 440" id="ckt" width="720">
      <defs>
        <animate id="animFlow" attributeName="cx" dur="1.1s" repeatCount="indefinite" fill="freeze" />
        <animate id="animFlowY" attributeName="cy" dur="1.1s" repeatCount="indefinite" fill="freeze" />
      </defs>
    </svg>
  </div>
  <div class="right-col">
    <div class="ctrl-box">
      <h3>控制面板</h3>
      <div>
        <button id="btnD0">D=0</button>
        <button id="btnD1">D=1</button>
      </div>
      <div>
        <button class="stepbtn" id="btnEnHigh">EN=1(打开)</button>
        <button class="stepbtn" id="btnEnLow">EN=0(锁存)</button>
      </div>
      <div>
        <button id="btnReset">重置</button>
      </div>
      <div class="note">
G1、G2：基本SR锁存器<br/>
G3、G4：导引控制门
      </div>
    </div>
    <div class="state-box">
      <h3>实时状态</h3>
      <div class="stateRow">
        <div class="stateBox">
          <div class="lab">EN(CLK)</div>
          <div class="stateVal" id="vEN">0</div>
          <div class="lab" id="sEN">低电平(锁存)</div>
        </div>
        <div class="stateBox">
          <div class="lab">D输入</div>
          <div class="stateVal" id="vD">0</div>
          <div class="lab">数据</div>
        </div>
        <div class="stateBox">
          <div class="lab">Qm输出</div>
          <div class="stateVal" id="vQm">0</div>
          <div class="lab" id="sQm">锁存保持</div>
        </div>
      </div>
      <div class="note">
EN=1：透明，Qm跟随D<br/>
EN=0：锁存，保持数据不变
      </div>
    </div>
  </div>
</div>
<div id="msg">操作提示：设置D值，打开EN抓取数据，关闭EN锁存保存结果。</div>

<script>
const NS='http://www.w3.org/2000/svg';
const $=id=>document.getElementById(id);
const OFF='#b8c4d1', ON='#ff8800', BLUE='#2f5d8c';
const FILL_ON='#ffe8cc',FILL_OFF='#ffffff',DIM='#8896a4';
const CLK_C='#6741d9', NAND_C='#087474';
const C=$('ckt');

let en=0, dIn=0;
let g3_out=1, g4_out=1;
let g1_out=0, g2_out=1;

const cad=(tag,attr,parent)=>{
  const el=document.createElementNS(NS,tag);
  for(let k in attr) el.setAttribute(k,attr[k]);
  (parent||C).appendChild(el);
  return el;
};
const txt=(x,y,str,size=11,color="#333",anchor="middle")=>{
  const t=cad('text',{x:x,y:y,'font-size':size,fill:color,"text-anchor":anchor,"font-family":"Consolas"});
  t.textContent=str;
  return t;
};

// IEC国标方形与非门：矩形框，内部写&，输出端小圆（取反）
function drawNandIec(x,y,nameTag){
  const g={};
  const w=46;
  const h=54;
  g.box=cad('rect',{x:x, y:y-h/2, width:w, height:h, stroke:NAND_C,"stroke-width":2,fill:FILL_OFF});
  txt(x+w/2, y+4,"&",16,"#222");
  //右上角门编号G1/G2/G3/G4
  txt(x+w-4, y-h/2+12, nameTag,12,NAND_C,"end");
  //输入
  g.in1=cad('line',{x1:x-20,y1:y-13,x2:x,y2:y-13,stroke:OFF,"stroke-width":2.4});
  g.in2=cad('line',{x1:x-20,y1:y+13,x2:x,y2:y+13,stroke:OFF,"stroke-width":2.4});
  //输出小圆圈
  g.bubble=cad('circle',{cx:x+w+6, cy:y, r:5, fill:FILL_OFF, stroke:NAND_C});
  g.out=cad('line',{x1:x+w+12,y1:y,x2:x+92,y2:y,stroke:OFF,"stroke-width":2.4});
  g.outDot=cad('circle',{cx:x+92,cy:y,r:4,fill:FILL_OFF,stroke:OFF});
  g.valText=txt(x+102,y+4,"0",14,DIM,"start");
  return g;
}

//四个门，G3 G4左侧；G1 G2右侧
const G3 = drawNandIec(120, 100, "G3");
const G4 = drawNandIec(120, 240, "G4");
const G1 = drawNandIec(380, 100, "G1");
const G2 = drawNandIec(380, 240, "G2");

//引脚文字标签
txt(90, 87, "D", 11, "#222", "end");
txt(90, 119, "EN",11, "#222", "end");
txt(90, 227, "D̄",11, "#222", "end");
txt(90, 259, "EN",11, "#222", "end");

txt(350, 87, "S'",11, "#c82423", "end");
txt(350, 119, "Qmₙ",11, "#c82423", "end");
txt(350, 227, "R'",11, "#c82423", "end");
txt(350, 259, "Qm",11, "#c82423", "end");

//外部D输入
txt(60,100,"D",14,BLUE,"end");
const dotD=cad('circle',{cx:80,cy:100,r:5,fill:FILL_OFF,stroke:OFF});
const wireD=cad('line',{x1:86,y1:100,x2:120,y2:100,stroke:OFF,"stroke-width":2.5});
const wireDdown=cad('polyline',{points:"80,100 80,227 120,227",stroke:OFF,"stroke-width":2.5,fill:"none"});

//外部EN输入
txt(60,270,"EN(CLK)",12,CLK_C,"end");
const dotEn=cad('circle',{cx:80,cy:270,r:5,fill:FILL_OFF,stroke:OFF});
const wireEn=cad('line',{x1:86,y1:270,x2:120,y2:270,stroke:OFF,"stroke-width":2.5});
const wireEnUp=cad('polyline',{points:"80,270 80,113 120,113",stroke:OFF,"stroke-width":2.5,fill:"none"});

//G3输出S' → G1
txt(232, 92, "S'",12,"#c82423","start");
const wireS=cad('line',{x1:212,y1:100,x2:380,y2:100,stroke:OFF,"stroke-width":2.5});
//G4输出R' → G2
txt(232, 232, "R'",12,"#c82423","start");
const wireR=cad('line',{x1:212,y1:240,x2:380,y2:240,stroke:OFF,"stroke-width":2.5});

//交叉反馈
const fbQmToG2=cad('polyline',{points:"472,100 540,100 540,253 380,253",stroke:OFF,"stroke-width":2.5,fill:"none"});
const fbQmnToG1=cad('polyline',{points:"472,240 540,240 540,113 380,113",stroke:OFF,"stroke-width":2.5,fill:"none"});

//Qm输出
const wireQmOut=cad('line',{x1:472,y1:100,x2:660,y2:100,stroke:OFF,"stroke-width":2.8});
txt(492,92,"Qm",12,"#c82423","start");
txt(492,232,"Qmₙ",12,"#c82423","start");
txt(672,104,"Qm",14,BLUE,"start");
const dotQmOut=cad('circle',{cx:654,cy:100,r:5,fill:FILL_OFF,stroke:OFF});

//光点
const flowDots=[];
function makeFlowDot(x0,y0,x1,y1,color){
  const dot = cad('circle',{cx:x0, cy:y0, r:4, fill:color, opacity:0});
  const anX = cad('animate',{attributeName:"cx", from:x0, to:x1, dur:"1.1s", repeatCount:"indefinite"} , dot);
  const anY = cad('animate',{attributeName:"cy", from:y0, to:y1, dur:"1.1s", repeatCount:"indefinite"} , dot);
  return {dot,anX,anY,x0,y0,x1,y1};
}
flowDots.push(makeFlowDot(86,100,120,100,"#ff8800"));
flowDots.push(makeFlowDot(86,270,120,270,"#6741d9"));
flowDots.push(makeFlowDot(212,100,380,100,"#ff8800"));
flowDots.push(makeFlowDot(212,240,380,240,"#ff8800"));
flowDots.push(makeFlowDot(472,100,654,100,"#ff8800"));

function nand(a,b){ return !(a&&b) ? 1 : 0; }
function calcAllGates(){
  g3_out = nand(dIn, en);
  g4_out = nand( (1-dIn), en );
  let q1=g1_out, q2=g2_out;
  for(let i=0;i<12;i++){
    let nq1 = nand(g3_out, q2);
    let nq2 = nand(g4_out, q1);
    q1=nq1; q2=nq2;
  }
  g1_out=q1; g2_out=q2;
}

function updateFlowDots(){
  const sigs=[dIn, en, g3_out, g4_out, g1_out];
  for(let i=0;i<flowDots.length;i++){
    const fd=flowDots[i];
    if(sigs[i]){ fd.dot.setAttribute("opacity","1"); fd.anX.beginElement();fd.anY.beginElement(); }
    else { fd.dot.setAttribute("opacity","0"); }
  }
}

function setNandGate(g, in1Val, in2Val, outVal){
  g.in1.setAttribute("stroke",in1Val?ON:OFF);
  g.in2.setAttribute("stroke",in2Val?ON:OFF);
  g.out.setAttribute("stroke",outVal?ON:OFF);
  g.outDot.setAttribute("fill",outVal?FILL_ON:FILL_OFF);
  g.outDot.setAttribute("stroke",outVal?ON:OFF);
  g.valText.textContent=outVal;
  g.valText.setAttribute("fill",outVal?ON:DIM);
  g.box.setAttribute("fill",outVal?FILL_ON:FILL_OFF);
}

function paintAll(){
  calcAllGates();
  dotD.setAttribute("fill",dIn?FILL_ON:FILL_OFF);
  dotD.setAttribute("stroke",dIn?ON:OFF);
  wireD.setAttribute("stroke",dIn?ON:OFF);
  wireDdown.setAttribute("stroke",dIn?ON:OFF);

  dotEn.setAttribute("fill",en?FILL_ON:FILL_OFF);
  dotEn.setAttribute("stroke",en?CLK_C:OFF);
  wireEn.setAttribute("stroke",en?CLK_C:OFF);
  wireEnUp.setAttribute("stroke",en?CLK_C:OFF);

  setNandGate(G3, dIn, en, g3_out);
  setNandGate(G4, (1-dIn), en, g4_out);
  setNandGate(G1, g3_out, g2_out, g1_out);
  setNandGate(G2, g4_out, g1_out, g2_out);

  wireS.setAttribute("stroke",g3_out?ON:OFF);
  wireR.setAttribute("stroke",g4_out?ON:OFF);
  fbQmToG2.setAttribute("stroke",g1_out?ON:OFF);
  fbQmnToG1.setAttribute("stroke",g2_out?ON:OFF);
  wireQmOut.setAttribute("stroke",g1_out?ON:OFF);
  dotQmOut.setAttribute("fill",g1_out?FILL_ON:FILL_OFF);
  dotQmOut.setAttribute("stroke",g1_out?ON:OFF);

  updateFlowDots();
  $("vEN").textContent=en;
  $("sEN").textContent=en?"EN=1高电平(打开)":"EN=0低电平(锁存)";
  $("vD").textContent=dIn;
  $("vQm").textContent=g1_out;
  $("sQm").textContent=en?"透明跟随D":"锁存保持";
}

$("btnD0").onclick=()=>{dIn=0; paintAll();$("msg").innerText="设置D=0，观察D输入线路电平变化。";};
$("btnD1").onclick=()=>{dIn=1; paintAll();$("msg").innerText="设置D=1，D输入线路出现流动光点。";};
$("btnEnHigh").onclick=()=>{en=1; paintAll();$("msg").innerText="EN=1，主锁存器打开，透明模式，Qm跟随D。";};
$("btnEnLow").onclick=()=>{en=0; paintAll();$("msg").innerText="EN=0，主锁存器关闭锁存，Qm保持当前数值不变。";};
$("btnReset").onclick=()=>{
  en=0;dIn=0;g3_out=1;g4_out=1;g1_out=0;g2_out=1;
  paintAll();
  $("msg").innerText="全部重置，回到初始状态。";
};

paintAll();
</script>
</body>
</html>
